services:
  # Banco da aplicação.
  # O Docker só cria o banco VAZIO. Tabelas e dados são criados pelo Liquibase
  # quando a aplicação sobe (src/main/resources/db/changelog).
  postgres:
    image: pgvector/pgvector:pg17   # Postgres 17 + extensão pgvector (para as aulas de Spring AI)
    container_name: demo-postgres
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo123
      TZ: America/Sao_Paulo
    ports:
      # 5433 no seu computador -> 5432 dentro do container.
      # Usamos 5433 para não brigar com um Postgres que já esteja instalado na máquina.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Interface web para olhar o banco: http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: demo-pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: demo123
      PGADMIN_CONFIG_SERVER_MODE: "False"          # modo desktop, já logado
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Conexão com o Postgres já cadastrada (dentro da rede do Docker a porta é 5432)
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgpass-src:ro
    # O Postgres só aceita o arquivo de senha se ele tiver permissão 600.
    # Como o arquivo montado é somente leitura, copiamos para dentro do container
    # e ajustamos a permissão lá, antes de iniciar o pgAdmin.
    entrypoint: >
      /bin/sh -c "
      cp /pgpass-src /var/lib/pgadmin/pgpass &&
      chmod 600 /var/lib/pgadmin/pgpass &&
      exec /entrypoint.sh
      "

  # Traces do OpenTelemetry: http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: demo-jaeger
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  postgres_data:
  pgadmin_data:
