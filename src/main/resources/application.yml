spring:
  application:
    name: demo

  # Virtual threads ligados (Project Loom)
  threads:
    virtual:
      enabled: true

  # Conexão com o Postgres do docker-compose (porta 5433 no seu computador).
  # Dá para trocar por variáveis de ambiente sem mexer no arquivo.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/demo}
    username: ${DB_USER:demo}
    password: ${DB_PASSWORD:demo123}

  jpa:
    # Quem cria e altera tabelas é o Liquibase.
    # O Hibernate só CONFERE se as entidades batem com o banco (e falha se não baterem).
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Changesets marcados com context "dev" (dados de exemplo) só rodam quando "dev" está ligado.
    contexts: ${LIQUIBASE_CONTEXTS:dev}

  # API Versioning nativo
  mvc:
    apiversion:
      use:
        header: X-API-Version
      required: false
      default: "1"          # versão usada quando o cliente não manda o header
      supported:
        - "1"
        - "2"

  # Spring AI - OpenAI
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:dummy}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7

# OpenTelemetry
otel:
  service:
    name: demo
  exporter:
    otlp:
      endpoint: http://localhost:4317
  traces:
    exporter: otlp
  metrics:
    exporter: otlp

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,threaddump,liquibase
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.demo: DEBUG
