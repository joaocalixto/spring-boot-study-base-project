databaseChangeLog:
  - changeSet:
      id: 001-create-users-table
      author: joao
      comment: Cria a tabela de usuários
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
              - column:
                  name: first_name
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(160)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_users_email
              - column:
                  name: phone
                  type: VARCHAR(40)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
      # createTable tem rollback automático (drop table), então não precisamos escrever um.
