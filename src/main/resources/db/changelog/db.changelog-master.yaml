# Arquivo "índice" do Liquibase.
# Ele não cria nada sozinho: só lista, EM ORDEM, os arquivos de mudança.
# Regra da casa: um arquivo novo para cada mudança; nunca editar um arquivo que já rodou.
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-create-users-table.yaml
  - include:
      file: db/changelog/changes/002-insert-sample-users.yaml
